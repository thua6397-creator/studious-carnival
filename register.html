<main style="max-width: 450px; margin: 50px auto; padding: 40px; background: #fff; border-radius: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.05);">
    <h2 style="text-align: center; color: #8B5E3C; margin-bottom: 30px;">Tạo tài khoản mới</h2>
    <form>
        <input type="text" placeholder="Họ và tên" style="width: 100%; padding: 15px; margin-bottom: 15px; border: 1px solid #F5E9DD; border-radius: 15px;">
        <input type="email" placeholder="Email" style="width: 100%; padding: 15px; margin-bottom: 15px; border: 1px solid #F5E9DD; border-radius: 15px;">
        <input type="password" placeholder="Mật khẩu" style="width: 100%; padding: 15px; margin-bottom: 15px; border: 1px solid #F5E9DD; border-radius: 15px;">
        <input type="password" placeholder="Xác nhận mật khẩu" style="width: 100%; padding: 15px; margin-bottom: 20px; border: 1px solid #F5E9DD; border-radius: 15px;">
        <button style="width: 100%; background: #B8875C; color: white; padding: 15px; border: none; border-radius: 15px; font-weight: 600; cursor: pointer;">Đăng ký</button>
    </form>
</main>
