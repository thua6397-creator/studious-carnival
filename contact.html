<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="css/style.css">
    <title>Liên hệ - OURS Bakery</title>
</head>
<body>
    <header style="background: #fff; padding: 20px; border-bottom: 2px solid #F5E9DD; display: flex; justify-content: space-between; align-items: center;">
    <div class="logo">
        <a href="index.html" style="font-size: 24px; font-weight: bold; color: #8B5E3C; text-decoration: none;">OURS Bakery</a>
    </div>
    <nav>
        <a href="index.html" style="margin: 0 15px; text-decoration: none; color: #555;">Trang chủ</a>
        <a href="products.html" style="margin: 0 15px; text-decoration: none; color: #555;">Sản phẩm</a>
        <a href="about.html" style="margin: 0 15px; text-decoration: none; color: #555;">Giới thiệu</a>
        <a href="contact.html" style="margin: 0 15px; text-decoration: none; color: #555;">Liên hệ</a>
        <a href="cart.html" style="margin: 0 15px; text-decoration: none; color: #B8875C; font-weight: bold;">🛒 Giỏ hàng</a>
    </nav>
</header>

    <!-- Header (Copy từ các trang trước) -->

    <main style="padding: 50px 10%; max-width: 1000px; margin: auto;">
        <h2 style="text-align: center; color: #8B5E3C; margin-bottom: 40px;">Liên hệ với chúng tôi</h2>
        
        <div style="display: flex; gap: 40px; flex-wrap: wrap;">
            <!-- Phần thông tin -->
            <div style="flex: 1; min-width: 300px; background: #FFF8F2; padding: 30px; border-radius: 20px;">
                <h3>Thông tin cửa hàng</h3>
                <p>📍 Địa chỉ: 123 Pastry Lane, Hà Nội</p>
                <p>📞 Hotline: 0123 456 789</p>
                <p>✉️ Email: oursbakery@gmail.com</p>
                <p>⏰ Giờ mở cửa: 08:00 - 22:00</p>
            </div>

        
            <div style="flex: 1; min-width: 300px;">
                <form>
                    <input type="text" placeholder="Họ tên của bạn" style="width: 100%; padding: 15px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 10px;">
                    <textarea placeholder="Nội dung cần liên hệ" style="width: 100%; padding: 15px; height: 120px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 10px;"></textarea>
                    <button type="button" onclick="alert('Cảm ơn bạn đã gửi tin nhắn!')" style="background: #B8875C; color: white; padding: 15px 30px; border: none; border-radius: 10px; cursor: pointer;">Gửi tin nhắn</button>
                </form>
            </div>
        </div>

        <!-- Bản đồ giả lập -->
        <div style="margin-top: 40px; text-align: center; background: #eee; height: 300px; display: flex; align-items: center; justify-content: center; border-radius: 20px;">
            <p style="color: #777;"><img src="images/1784027742539_192346281794843173_8707215739143763288_173eaed240addc47c76217992a27e251.jpg"></p>
        </div>
    </main>

  
</body>
</html>
